/* Pure replay state: shared by UI and all-scenario regression tests. */
const ReplayEngine = (() => {
  const length = ps => ps.slice(1).reduce((sum,b,i)=>sum+Math.hypot(b[0]-ps[i][0],b[1]-ps[i][1]),0);
  function at(ps, fraction) {
    let remaining=length(ps)*Math.max(0,Math.min(1,fraction));
    for(let i=1;i<ps.length;i++) {
      const a=ps[i-1],b=ps[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(d && remaining<=d) return [a[0]+(b[0]-a[0])*remaining/d,a[1]+(b[1]-a[1])*remaining/d];
      remaining-=d;
    }
    return ps[ps.length-1].slice();
  }
  function slice(ps, from, to) {
    const total=length(ps), out=[at(ps,from)];let travelled=0;
    for(let i=1;i<ps.length;i++) {
      travelled+=Math.hypot(ps[i][0]-ps[i-1][0],ps[i][1]-ps[i-1][1]);
      if(travelled>from*total && travelled<to*total)out.push(ps[i]);
    }
    out.push(at(ps,to));return out;
  }
  function sample(model,parcel,time) {
    const nodes=Object.fromEntries(model.nodes.map(n=>[n.id,n]));
    const edges=Object.fromEntries(model.edges.map(e=>[e.id,e]));
    const pointsFor=leg=>{
      if(!leg.edges?.length)return null;
      const route=[];let at=leg.a;
      for(const id of leg.edges){const edge=edges[id];if(!edge||edge.a!==at)return null;route.push(...edge.points.slice(route.length?1:0));at=edge.b;}
      return at===leg.b?route:null;
    };
    const routeUnknown=leg=>!pointsFor(leg)||leg.routeStatus==='unknown';
    const playbackPoints=leg=>pointsFor(leg)||[[nodes[leg.a].x,nodes[leg.a].y],[nodes[leg.b].x,nodes[leg.b].y]];
    const t=Math.max(0,Math.min(parcel.duration,time));
    let index=0;for(let i=0;i<parcel.events.length;i++)if(parcel.events[i].t<=t)index=i;
    const event=parcel.events[index], upcoming=parcel.events[index+1]||null;
    const leg=parcel.legs.find(l=>t>=l.start&&t<l.end)||null;
    const visited=parcel.stops.filter(s=>s.arrival<=t),stop=visited[visited.length-1];
    const nextStop=parcel.stops.find(s=>s.arrival>t)||null;
    const done=t>=parcel.duration;
    const xy=leg?(routeUnknown(leg)?[nodes[leg.a].x,nodes[leg.a].y]:at(playbackPoints(leg),(t-leg.start)/(leg.end-leg.start))):[nodes[stop.id].x,nodes[stop.id].y];
    const history=[];let liquid=[];
    for(const l of parcel.legs) {
      if(l.start>=t)break;
      if(routeUnknown(l))continue;
      const ps=playbackPoints(l),f=Math.min(1,(t-l.start)/(l.end-l.start));
      history.push(slice(ps,0,f));
    }
    // The current leg stays bright throughout its arrival dwell. At departure,
    // it becomes history; the new leg grows from zero without losing history.
    // At the end highlight the entire *travelled* path, including held outcomes.
    const latestLeg=parcel.legs.filter(l=>l.start<t).at(-1);
    if(latestLeg&&!routeUnknown(latestLeg)) {
      const ps=playbackPoints(latestLeg);
      liquid=slice(ps,0,Math.min(1,(t-latestLeg.start)/(latestLeg.end-latestLeg.start)));
    }
    const bright=done?history:(liquid.length?[liquid]:[]);
    const possibleExternalHandling=!!(leg?.possibleExternalHandling);
    const phase=done?parcel.outcome||'completed':leg?(routeUnknown(leg)?(possibleExternalHandling?'possible-external-handling':'route-unknown'):'travelling'):'processing';
    const current=done?parcel.completeness:leg?(routeUnknown(leg)?`Observed movement: ${nodes[leg.a].label} → ${nodes[leg.b].label}; ${possibleExternalHandling?'possible external handling':'physical route unknown'}`:`Moving: ${nodes[leg.a].label} → ${nodes[leg.b].label}`):event.Summary;
    const next=done?'Replay ended here. No further movement is implied.':leg&&routeUnknown(leg)?`Next recorded scanner: ${nodes[leg.b].label}. Conveyor route is not mapped.`:nextStop?`Next recorded position in ${(nextStop.arrival-t).toFixed(1)}s: ${nodes[nextStop.id].label}`:`Final observations: ${Math.max(0,parcel.duration-t).toFixed(1)}s remaining.`;
    const positionKnown=!(leg&&routeUnknown(leg))&&nodes[stop.id].physical!==false;
    return {t,xy,positionKnown,possibleExternalHandling,index,event,upcoming,leg,routeUnknown:leg?routeUnknown(leg):false,stop,nextStop,done,phase,current,next,history,liquid,bright};
  }
  return {sample,at,slice,length,pointsFor(model,leg){
    const edges=Object.fromEntries(model.edges.map(edge=>[edge.id,edge]));let at=leg.a,points=[];
    if(!leg.edges?.length)return null;
    for(const id of leg.edges){const edge=edges[id];if(!edge||edge.a!==at)return null;points.push(...edge.points.slice(points.length?1:0));at=edge.b;}
    return at===leg.b?points:null;
  }};
})();

/* Screen-space label layout shared with deterministic layout tests. */
const LabelLayout=(()=>{
  const overlap=(a,b)=>a.x<b.x+b.w+4&&a.x+a.w+4>b.x&&a.y<b.y+b.h+4&&a.y+a.h+4>b.y;
  function crosses(a,b,rect){
    // Segment/rectangle clipping, inclusive. Also handles vertical/zero-length segments.
    const r={x:rect.x-5,y:rect.y-5,w:rect.w+10,h:rect.h+10};
    let low=0,high=1;const dx=b[0]-a[0],dy=b[1]-a[1];
    for(const [p,q] of [[-dx,a[0]-r.x],[dx,r.x+r.w-a[0]],[-dy,a[1]-r.y],[dy,r.y+r.h-a[1]]]){
      if(p===0){if(q<0)return false;continue}
      const u=q/p;if(p<0)low=Math.max(low,u);else high=Math.min(high,u);
      if(low>high)return false;
    }
    return true;
  }
  function arrange(items,width,height,blocked=[],segments=[],previous=[]){
    const placed=[],obstacles=[...blocked,...items.map(n=>({x:n.x-14,y:n.y-14,w:28,h:28}))];
    for(const n of items){
      const w=Math.min(170,Math.max(80,n.label.length*7+16)),h=n.label.length>22?46:28;
      let box=null;
      const old=previous.find(b=>b.id===n.id);
      if(old){const c={x:old.x+n.x-old.anchor[0],y:old.y+n.y-old.anchor[1],w,h};
        if(c.x>=8&&c.y>=85&&c.x+w<=width-8&&c.y+h<=height-85&&!obstacles.some(o=>overlap(c,o))&&!segments.some(s=>crosses(s[0],s[1],c)))box=c;
      }
      for(const gap of [22,46,76,110]){
        if(box)break;
        for(const [x,y] of [[n.x-w/2,n.y-gap-h],[n.x+gap,n.y-h/2],[n.x-w/2,n.y+gap],[n.x-gap-w,n.y-h/2]]){
          const c={x,y,w,h};
          if(x<8||y<85||x+w>width-8||y+h>height-85)continue;
          if(obstacles.some(o=>overlap(c,o)))continue;
          if(segments.some(s=>crosses(s[0],s[1],c)))continue;
          box=c;break;
        }
        if(box)break;
      }
      if(box){placed.push({...box,id:n.id,label:n.label,anchor:[n.x,n.y]});obstacles.push(box)}
    }
    return placed;
  }
  function rotate(point,degrees){const a=degrees*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [point[0]*c-point[1]*s,point[0]*s+point[1]*c]}
  function bounds(points,degrees=0,padding=65){const ps=points.map(p=>rotate(p,degrees)),xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);const x=Math.min(...xs)-padding,y=Math.min(...ys)-padding;return[x,y,Math.max(...xs)-x+padding,Math.max(...ys)-y+padding]}
  return{arrange,overlap,crosses,rotate,bounds};
})();

const layerOf=e=>{const text=((e.Layer||'')+' '+(e.Source||'')+' '+(e.EventType||'')+' '+(e.Summary||'')+' '+(e.Raw||e.RawLine||'')).toLowerCase();if(/\b(?:db|database)\b|\b(?:insert|update) \(tudata\)/.test(text))return'Db';if(/plc|sendtasktoplc|fahrziel|quittung|acknowledge|route response/.test(text))return'PLC';if(/\b(?:lvs|transport)\b|conmfr|socket|\bsent:|\breceived:/.test(text))return'Transport';if(/logic|scanner|scan|weight|scale|route|decision|print|label/.test(text))return'Logic';return'Other'};
const operatorEvent=e=>{const raw=((e.Summary||'')+' '+(e.Raw||e.RawLine||'')).toLowerCase(),capture=e.CaptureFields||{};let action='System exchange',role='System';if(capture.scanner_decision_status){action=capture.scanner_decision_code==='WG'?'Continue straight (WG)':capture.scanner_decision_code?`Output request ${capture.scanner_decision_code}`:'PLC route report';if(capture.route_attempt_target_code)action+=` → target ${capture.route_attempt_target_code}`;if(capture.scanner_reported_code)action+=`; PLC reported ${capture.scanner_reported_code}`;if(capture.route_attempt_destination_changed)action+=`; destination attempt changed ${capture.route_attempt_previous_target_code} → ${capture.route_attempt_target_code}`;if(capture.scanner_decision_status==='decision-plc-report-mismatch')action+='; commanded and reported branches differ';if(capture.route_attempt_next_observed_location)action+=`; next scanner observed: ${capture.route_attempt_next_observed_location}`;role='Route decision';}else if(/scanner|scan|onscanner/.test(raw)){action='Scanner read';role='Scanner'}else if(/weight|scale|brutto/.test(raw)){action='Weight check';role='Scale'}else if(/print|label/.test(raw)){action='Label print';role='Labeler'}else if(/acknowledge|quittung|route response/.test(raw)){action='PLC route response received';role='PLC'}else if(/plc|route|divert|fahrziel/.test(raw)){action='Route decision sent to PLC';role='PLC / Logic'}else if(/save|insert|update|database|db/.test(raw)){action='Parcel state stored';role='Database'}return{action,role,summary:capture.scanner_decision_status?action:e.Summary||'Recorded exchange',raw:e.Raw||e.RawLine||'',outcome:capture.scanner_decision_status||e.Outcome||e.Status||'',layer:layerOf(e)}};

  function updateTimeline(time,instant=false){const host=document.getElementById('events'),rows=[...host.querySelectorAll('.timeline-group')];if(!rows.length)return;let current=0;rows.forEach((row,i)=>{if(+row.dataset.start<=time)current=i});rows.forEach((row,i)=>{row.classList.toggle('past',i<current);row.classList.toggle('current',i===current);row.classList.toggle('future',i>current)});const row=rows[current];if(row&&host.dataset.current!=current){host.dataset.current=current;host.scrollTo({top:Math.max(0,row.offsetTop-42),behavior:instant?'auto':'smooth'})}}
  window.updateJourneyTimeline=updateTimeline;
  window.parcelVisits=visits;
  const host=document.getElementById('events');if(host)document.getElementById('pick').addEventListener('change',normalize);window.normalizeParcelTimeline=normalize;window.addEventListener('load',normalize);

function compactTimelineRows(){document.querySelectorAll('#events>.timeline-group>.event').forEach(button=>{if(button.dataset.compact)return;const original=button.textContent,parts=original.split(' · '),time=parts.shift()||'',rest=parts.join(' · '),divider=rest.indexOf(' — '),place=divider<0?rest:rest.slice(0,divider),count=original.match(/(\d+) exchanges$/)?.[1];button.title=divider<0?'Recorded station visit':rest.slice(divider+3);button.replaceChildren();for(const [className,text] of [['event-time',time],['event-place',place],['event-count',count?count+' events':'']]){const span=document.createElement('span');span.className=className;span.textContent=text;button.append(span)}button.dataset.compact='1'})}
