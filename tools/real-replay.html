 document.querySelectorAll('.station').forEach(g=>{const labels=g.querySelectorAll('.label,.code');g.addEventListener('mouseenter',()=>labels.forEach(x=>x.style.display='block'));g.addEventListener('mouseleave',()=>labels.forEach(x=>x.style.display='none'))});
 // Keep the secondary parcel-data label scoped to the primary label. Clicking
 // anywhere else, including header/footer/side-panel controls, closes it.
 (()=>{const primary=document.getElementById('bubble'),secondary=document.getElementById('parcel-detail');if(!primary||!secondary)return;const close=()=>{secondary.hidden=true};document.addEventListener('pointerdown',event=>{if(!event.target.closest('#bubble,#parcel-detail'))close()},true);document.addEventListener('keydown',event=>{if(event.key==='Escape')close()})})();</script></html>
